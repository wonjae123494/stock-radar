# 수급 쌍끌이 레이더 — 클라우드 폴백 발송 (PC가 꺼져 있어도 매일 발송)
#
# 매 평일 19:40 KST(10:40 UTC)에 실행된다.
# 로컬(Claude Code 19:05 예약)이 이미 발송해서 data/last_sent.txt 가 오늘 날짜면
# run_fallback.py 가 스스로 스킵하므로 이중 발송되지 않는다.
# 뉴스 분석(why/strategy/drop_why)은 로컬 Claude 실행에서만 새로 작성되며,
# 이 워크플로우는 수급 데이터·차트 중심의 기본 버전을 보낸다.
name: daily-radar

on:
  schedule:
    - cron: "40 10 * * 1-5"   # 19:40 KST, 평일
  workflow_dispatch:           # 수동 실행 (테스트용)
    inputs:
      force:
        description: "중복 발송 방지 무시하고 강제 발송 (테스트)"
        type: boolean
        default: false

permissions:
  contents: write              # 발송 마커(data/last_sent.txt) 커밋용

concurrency:
  group: daily-radar
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Asia/Seoul
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Write secrets
        run: |
          printf 'KRX_ID=%s\nKRX_PW=%s\n' "${{ secrets.KRX_ID }}" "${{ secrets.KRX_PW }}" > .env
          printf '{ "bot_token": "%s", "chat_id": "%s" }\n' "${{ secrets.TELEGRAM_BOT_TOKEN }}" "${{ secrets.TELEGRAM_CHAT_ID }}" > config.json

      - name: Run pipeline (dedup/holiday checks inside)
        run: python run_fallback.py ${{ inputs.force && '--force' || '' }}

      - name: Commit sent marker & data
        if: always()
        run: |
          rm -f .env config.json
          git config user.name "radar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "chore: daily radar data $(date +%F)"
          git pull --rebase origin ${GITHUB_REF_NAME} || true
          git push || true
