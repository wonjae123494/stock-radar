# 수급 쌍끌이 레이더 — 주간 모의투자 성과 평가 (PC가 꺼져 있어도 발송)
#
# 매주 토요일 10:30 KST(01:30 UTC)에 실행된다.
# 로컬(Claude Code 토 10:00 예약, 뉴스 분석 포함 풍부판)이 먼저 발송해서
# data/last_eval.txt 가 오늘 날짜면 evaluate.py --send 가 스스로 스킵한다.
name: weekly-eval

on:
  schedule:
    - cron: "30 1 * * 6"     # 토요일 10:30 KST
  workflow_dispatch:
    inputs:
      force:
        description: "오늘 발송 여부 무시하고 강제 발송 (테스트)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: weekly-eval
  cancel-in-progress: false

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Asia/Seoul
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0     # git 이력 백필용 (과거 recommendations.json)

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Write secrets
        run: |
          printf 'KRX_ID=%s\nKRX_PW=%s\n' "${{ secrets.KRX_ID }}" "${{ secrets.KRX_PW }}" > .env
          printf '{ "bot_token": "%s", "chat_id": "%s" }\n' "${{ secrets.TELEGRAM_BOT_TOKEN }}" "${{ secrets.TELEGRAM_CHAT_ID }}" > config.json

      - name: Evaluate & send
        run: python evaluate.py --send ${{ inputs.force && '--force' || '' }}

      - name: Commit eval results
        if: always()
        run: |
          rm -f .env config.json
          git config user.name "radar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "chore: weekly eval $(date +%F)"
          git pull --rebase origin ${GITHUB_REF_NAME} || true
          git push || true
